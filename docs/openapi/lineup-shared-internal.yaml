components:
  schemas:
    TeamsWithMidweekMatchesOverride:
      type: array
      description: >-
        Override manuale e opzionale delle squadre con turni infrasettimanali/coppe
        europee nella finestra ±3 giorni. Se omesso, il dato è calcolato automaticamente
        da FixturesTable (popolata dal job di sincronizzazione con Football-Data.org).
        Da usare solo se la sincronizzazione non è ancora avvenuta per una squadra.
      items:
        type: string
      example: [Inter, Milan, Atalanta]