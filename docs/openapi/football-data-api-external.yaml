openapi: 3.0.3
info:
  title: Football-Data.org v4 Client API
  version: 1.0.0
servers:
  - url: https://api.football-data.org/v4

security:
  - ApiKeyAuth: []

paths:
  /teams/{teamId}/matches:
    get:
      summary: Recupera le prossime o ultime partite di una squadra
      tags:
        - FootballData
      operationId: getTeamMatches
      security:
        - ApiKeyAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            example: "SCHEDULED"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesResponse'

  /competitions/{code}/teams:
    get:
      summary: Elenco delle squadre partecipanti a una competizione
      description: >
        Usata per risolvere in automatico i teamId numerici delle squadre configurate in
        FootballDataTeamsConfig (nome -> id), invece di doverli scoprire e incollare a mano:
        un id sbagliato inserito manualmente farebbe leggere silenziosamente i dati di
        un'altra squadra, senza alcun errore visibile.
      tags:
        - FootballData
      operationId: getCompetitionTeams
      security:
        - ApiKeyAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "SA"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsResponse'

components:
  securitySchemes:
    # Football-Data.org v4 autentica tramite header X-Auth-Token (NON e' un Bearer/OAuth token).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    MatchesResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'

    Match:
      type: object
      properties:
        id:
          type: integer
        utcDate:
          type: string
          format: date-time
        status:
          type: string
        matchday:
          type: integer
          description: Numero giornata di campionato (valorizzato per le partite di Serie A)
        competition:
          $ref: '#/components/schemas/Competition'
        homeTeam:
          $ref: '#/components/schemas/TeamRef'
        awayTeam:
          $ref: '#/components/schemas/TeamRef'

    Competition:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string

    TeamRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    TeamsResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionTeam'

    CompetitionTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        shortName:
          type: string
        tla:
          type: string
          description: Sigla a 3 lettere della squadra (es. INT, MIL, JUV, NAP)