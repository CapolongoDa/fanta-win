openapi: 3.0.3
info:
  title: API B2B Gestione Rosa e Predizione Formazione
  description: >-
    API REST B2B per la gestione della rosa su DynamoDB e il calcolo predittivo 
    della formazione ottimale di Fantacalcio (FantaClaude).
  version: 2.10.0
  x-api-id: fantaclaude-lineup-manager-api-b2b
  termsOfService: https://fantaclaude.ai/termini-di-servizio
  contact:
    name: Supporto FantaClaude
    url: https://fantaclaude.ai/supporto
servers:
  - url: http://localhost:8081
    description: Ambiente locale di sviluppo (server.port=8081, nessun context-path configurato)
  - url: https://api.fantaclaude.ai
    description: Ambiente di produzione (placeholder, non ancora deployato)

tags:
  - name: Roster
    description: Gestione dei calciatori all'interno della rosa dell'utente su DynamoDB
  - name: Prediction
    description: Calcolo predittivo dell'undici titolare, della panchina e del modulo ideale
  - name: MatchStats
    description: Import delle statistiche di giornata (voto/bonus/malus) dei calciatori
  - name: PlayerCatalog
    description: Anagrafica completa dei calciatori di Serie A (quotazioni fantacalcio.it), usata per risolvere nome+ruolo in un id univoco quando si aggiunge un giocatore alla rosa

paths:
  /fanta-private/rosters:
    get:
      summary: Elenca le rose dell'utente autenticato
      description: >
        Torna rosterId e nome squadra di ogni rosa posseduta dall'utente autenticato (il claim "sub"
        del JWT Cognito), cosi' il chiamante non deve conoscere a memoria i rosterId. Se
        l'autenticazione Cognito non e' configurata (vedi SecurityConfig), torna semplicemente TUTTE
        le rose esistenti, comportamento singolo-tenant coerente con quello attuale.
      operationId: listMyRosters
      tags:
        - Roster
      responses:
        '200':
          description: Elenco recuperato con successo (puo' essere vuoto)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RosterSummary'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/getRoster/{rosterId}:
    get:
      summary: Recupera la rosa completa dell'utente
      description: Restituisce l'elenco di tutti i calciatori divisi per ruolo presenti in rosa.
      operationId: getRoster
      tags:
        - Roster
      parameters:
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
        - name: matchDay
          in: query
          required: true
          description: giornata di campionato per cui calcolare il rating dei giocatori
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterResponse'
        '403':
          description: La rosa appartiene a un altro utente
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '404':
          description: Not Found Roster
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/addPlayer/{rosterId}:
    post:
      summary: Aggiunge o aggiorna un giocatore nella rosa
      description: Inserisce un nuovo calciatore o ne aggiorna le statistiche e lo stato corrente.
      operationId: addOrUpdatePlayer
      tags:
        - Roster
      parameters:
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Player'
      responses:
        '200':
          description: Giocatore salvato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          description: Invalid player data
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '403':
          description: La rosa appartiene a un altro utente
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '409':
          description: >-
            Conflitto: slot del ruolo gia' al completo, oppure il giocatore e' stato modificato da
            un'altra richiesta nel frattempo (controllo di versione ottimistico)
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/addPlayers:
    post:
      summary: Aggiunge in blocco piu' giocatori a una rosa risolvendoli dal catalogo Serie A
      description: >
        Riceve un rosterId e una lista di {nome, ruolo} come li scrive l'utente (es. "Oyono A.",
        DIF) e risolve ciascuno contro l'anagrafica completa di Serie A (PlayerCatalog, tag
        PlayerCatalog) per ricavarne l'id univoco: l'id non viene mai fornito dal chiamante. Se il
        rosterId non corrisponde a nessuna rosa esistente, ne viene creata una nuova (assegnata al
        chiamante come proprietario, se l'autenticazione e' attiva). Una entry con ruolo non
        riconosciuto, senza corrispondenza, o con nome ambiguo (piu' giocatori con lo stesso ruolo e
        nome simile, es. "Oyono" senza suffisso) non blocca le altre e viene riportata in
        "unresolved" col motivo. I giocatori risolti vengono aggiunti riusando lo stesso controllo di
        capienza per ruolo (ROSTER_SLOTS) di /fanta-private/addPlayer/{rosterId}; la richiesta nel
        suo complesso e' inoltre limitata a un massimo di 25 giocatori (vedi BulkAddRosterRequest).
      operationId: addPlayersBulk
      tags:
        - Roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddRosterRequest'
      responses:
        '200':
          description: Elaborazione completata (anche parzialmente, vedi unresolved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAddResult'
        '403':
          description: La rosa appartiene a un altro utente
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '400':
          description: Corpo della richiesta assente o non valido, o piu' di 25 giocatori in un'unica richiesta
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/{playerId}/{rosterId}:
    delete:
      summary: Rimuove un giocatore dalla rosa
      description: Elimina un calciatore specifico dalla tabella DynamoDB tramite il suo identificativo.
      operationId: deletePlayer
      tags:
        - Roster
      parameters:
        - name: playerId
          in: path
          required: true
          description: ID unico del calciatore
          schema:
            type: string
            example: PLAYER#inter_lautaro
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
      responses:
        '204':
          description: Giocatore rimosso con successo
        '403':
          description: La rosa appartiene a un altro utente
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/matchstats/import:
    post:
      summary: Importa le statistiche di una giornata da file CSV
      description: >
        Carica un file CSV con voto/fantavoto/bonus/malus dei calciatori per una giornata gia' disputata
        (fonte: sito voti fantacalcio, compilazione manuale). Formato atteso, separatore ';', UTF-8, intestazione
        su prima riga: giocatore;squadra;giornata;stagione;avversario;casa;voto;fantavoto;gol;assist;ammonizioni;espulsioni;xg;xa.
        Il giocatore viene risolto per nome+squadra reale contro l'anagrafica; le righe non risolvibili
        non bloccano l'import ma vengono riportate in errors.
      operationId: importMatchStats
      tags:
        - MatchStats
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File CSV con le statistiche della giornata
      responses:
        '200':
          description: Import completato (anche parzialmente, vedi errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatsImportResult'
        '400':
          description: File assente o non leggibile come CSV
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/matchstats/fixture-lookup/{realTeam}/{matchday}:
    get:
      summary: Recupera da Football-Data.org il vero avversario di una squadra per una giornata
      description: >
        Interroga in tempo reale Football-Data.org (lo stesso client esterno usato dalla sincronizzazione
        delle Fixtures) per restituire avversario reale, casa/trasferta, data e stato della partita di
        una squadra per una specifica giornata di Serie A. Pensato per verificare/prefillare a mano i
        campi avversario/casa prima di compilare il CSV di /fanta-private/matchstats/import, evitando
        errori di trascrizione (es. avversario scritto uguale alla squadra stessa).
      operationId: lookupMatchFixture
      tags:
        - MatchStats
      parameters:
        - name: realTeam
          in: path
          required: true
          description: Nome della squadra reale, come in anagrafica giocatori
          schema:
            type: string
            example: Inter
        - name: matchday
          in: path
          required: true
          description: Numero della giornata di Serie A da cercare
          schema:
            type: integer
            example: 4
      responses:
        '200':
          description: Partita trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureLookupResult'
        '404':
          description: >-
            Nessuna partita trovata per questa squadra/giornata, oppure la squadra non e' risolvibile
            su Football-Data.org
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Football-Data.org temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/lineups/sync-official/{rosterId}:
    post:
      summary: Legge da SportMonks la formazione ufficiale e aggiorna la disponibilita' dei giocatori
      description: >
        Per ogni squadra reale presente nella rosa, cerca su SportMonks (API 3.0) la partita nella
        finestra di qualche giorno attorno ad "oggi" e, se la formazione ufficiale e' gia' stata
        comunicata (di norma ~1h prima del calcio d'inizio), aggiorna in automatico
        AvailabilityReport.startingProbability dei giocatori in rosa: 100 se confermati titolari,
        0 se confermati in panchina. I giocatori non trovati nella formazione (non ancora
        pubblicata, squadra non risolta su SportMonks o nome non corrispondente) non vengono
        toccati e la squadra compare in unresolvedTeams.
      operationId: syncOfficialLineup
      tags:
        - Lineups
      parameters:
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
      responses:
        '200':
          description: Sincronizzazione eseguita (anche se nessuna formazione era ancora disponibile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialLineupSyncResult'
        '404':
          description: Rosa non trovata
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: SportMonks temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/matchstats/sync-real/{rosterId}/{matchday}:
    post:
      summary: Sincronizza da SportMonks gol/assist/cartellini/gol-subiti reali di una giornata
      description: >
        Per ogni giocatore in rosa, legge da SportMonks (endpoint /rounds/seasons/{seasonId}, un'unica
        chiamata per l'intera giornata) gli eventi oggettivi della partita della sua squadra reale in
        quella giornata: gol, assist (related_player_id sull'evento Goal), ammonizioni, espulsioni e,
        per portieri/difensori, gol subiti dalla squadra. Il voto (pagella) NON viene toccato: resta
        quello gia' presente (manuale, es. da /fanta-private/matchstats/import) o vuoto se il giocatore
        non ha ancora un voto per questa giornata - in quel caso fantavoto resta vuoto finche' il voto
        non viene valorizzato. Se la riga PlayerMatchStat per playerId+giornata non esiste ancora viene
        creata. Richiede fantawin.sportmonks-serie-a-season-id configurato. Al termine scrive anche un
        export CSV con lo storico corrente del roster in fantawin.match-stats-export-dir.
      operationId: syncRealMatchStats
      tags:
        - MatchStats
      parameters:
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
        - name: matchday
          in: path
          required: true
          description: numero di giornata di Serie A da sincronizzare
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Sincronizzazione eseguita (anche se qualche partita non e' stata trovata)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatsSyncResult'
        '404':
          description: Rosa non trovata
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error (es. fantawin.sportmonks-serie-a-season-id non configurato)
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: SportMonks temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/predict/lineup/{rosterId}:
    post:
      summary: Calcola l'undici titolare e la panchina ottimale per la giornata
      description: >
        Elabora i dati attuali della rosa (stato di forma, storico avversario, impegni europei/infrasettimanali e titolarità)
        e applica i moduli logici del FantaRating per calcolare la formazione ideale e il Modificatore di Difesa.
      operationId: calculateOptimalLineup
      tags:
        - Prediction
      parameters:
        - name: rosterId
          in: path
          required: true
          description: id della squadra del fantacalcio
          schema:
            type: string
            example: junior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineupRequest'
      responses:
        '200':
          description: Calcolo predittivo completato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineupResponse'
        '422':
          description: >-
            Rosa insufficiente per comporre uno qualsiasi dei moduli previsti (3-4-3, 4-3-3, 3-5-2,
            4-4-2) - es. nessun portiere disponibile o troppi pochi giocatori schierabili
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

  /fanta-private/playercatalog/import:
    post:
      summary: Importa l'anagrafica completa di Serie A da file CSV (quotazioni fantacalcio.it)
      description: >
        Carica un file CSV con id, nome, ruolo e squadra di TUTTI i calciatori di Serie A (fonte:
        quotazioni fantacalcio.it), usato per popolare/aggiornare PlayerCatalog. Questa anagrafica e'
        poi usata da /fanta-private/addPlayers per risolvere nome+ruolo in un id quando si
        aggiunge un giocatore alla rosa. Formato atteso, separatore ';', UTF-8, intestazione su prima
        riga: id;nome;ruolo;squadra. Ruolo accetta sia P/D/C/A che POR/DIF/CEN/ATT. Le righe non
        risolvibili non bloccano l'import ma vengono riportate in errors.
      operationId: importPlayerCatalog
      tags:
        - PlayerCatalog
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File CSV con l'anagrafica completa di Serie A
      responses:
        '200':
          description: Import completato (anche parzialmente, vedi errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCatalogImportResult'
        '400':
          description: File assente o non leggibile come CSV
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'
        '503':
          description: Storage DynamoDB temporaneamente non raggiungibile
          content:
            application/json:
              schema:
                $ref: 'problem-internal.yaml#/components/schemas/Problem'

components:
  schemas:
    RosterSummary:
      type: object
      required:
        - rosterId
        - teamName
      properties:
        rosterId:
          type: string
          example: junior
        teamName:
          type: string
          example: AS Junior.

    PlayerCatalogImportResult:
      type: object
      required:
        - imported
        - skipped
        - errors
      properties:
        imported:
          type: integer
          description: Numero di righe importate/aggiornate con successo in PlayerCatalog
          example: 516
        skipped:
          type: integer
          description: Numero di righe scartate (ruolo non riconosciuto o riga non valida)
          example: 0
        errors:
          type: array
          description: Dettaglio delle righe scartate, con numero di riga e motivo
          items:
            type: string
          example: ["riga 12: ruolo non riconosciuto: 'X' (attesi P/D/C/A o POR/DIF/CEN/ATT)"]

    BulkAddPlayerEntry:
      type: object
      required:
        - nome
        - ruolo
      properties:
        nome:
          type: string
          description: >-
            Nome del calciatore come in anagrafica fantacalcio.it (PlayerCatalog). Se il cognome e'
            condiviso da piu' giocatori nello stesso ruolo, usa il nome esatto col suffisso
            disambiguante (es. "Oyono A." invece di "Oyono").
          example: Oyono A.
        ruolo:
          type: string
          description: Ruolo del calciatore, sigla classica (P/D/C/A) o spelling completo (POR/DIF/CEN/ATT)
          example: DIF
      example:
        nome: Oyono A.
        ruolo: DIF

    BulkAddRosterRequest:
      type: object
      required:
        - rosterId
        - players
      properties:
        rosterId:
          type: string
          description: >-
            Id della rosa a cui aggiungere i giocatori. Se non esiste ancora, viene creata una
            nuova rosa con questo id (assegnata al chiamante come proprietario, se l'autenticazione
            e' attiva - vedi SecurityConfig).
          example: nuova-squadra
        players:
          type: array
          description: >-
            Elenco dei giocatori da aggiungere (nome + ruolo, risolti contro l'anagrafica
            PlayerCatalog - vedi BulkAddPlayerEntry). Massimo 25 elementi per richiesta: la rosa
            nel suo complesso resta comunque vincolata a 3 POR + 8 DIF + 8 CEN + 6 ATT = 25
            giocatori totali (vedi ROSTER_SLOTS).
          items:
            $ref: '#/components/schemas/BulkAddPlayerEntry'
          maxItems: 25
      example:
        rosterId: nuova-squadra
        players:
          - nome: Oyono A.
            ruolo: DIF
          - nome: Thuram
            ruolo: A

    BulkAddResult:
      type: object
      required:
        - added
        - unresolved
      properties:
        added:
          type: array
          description: Giocatori risolti e aggiunti con successo alla rosa
          items:
            $ref: '#/components/schemas/Player'
        unresolved:
          type: array
          description: Entry non risolvibili (ruolo non riconosciuto, nessun match, o nome ambiguo), con il motivo
          items:
            $ref: '#/components/schemas/BulkAddUnresolvedEntry'

    BulkAddUnresolvedEntry:
      type: object
      required:
        - nome
        - ruolo
        - motivo
      properties:
        nome:
          type: string
          example: Oyono
        ruolo:
          type: string
          example: DIF
        motivo:
          type: string
          example: "nome ambiguo, possibili corrispondenze: Oyono A. (Frosinone), Oyono J. (Frosinone) - ripeti specificando il nome esatto come in anagrafica"

    MatchStatsImportResult:
      type: object
      required:
        - imported
        - skipped
        - errors
      properties:
        imported:
          type: integer
          description: Numero di righe importate/aggiornate con successo
          example: 22
        skipped:
          type: integer
          description: Numero di righe scartate (giocatore non risolto o riga non valida)
          example: 1
        errors:
          type: array
          description: Dettaglio delle righe scartate, con numero di riga e motivo
          items:
            type: string
          example: ["riga 5: nessun giocatore trovato per 'Mario Rossi' (Empoli)"]

    OfficialLineupSyncResult:
      type: object
      required:
        - updatedPlayers
        - unresolvedTeams
      properties:
        updatedPlayers:
          type: array
          items:
            $ref: '#/components/schemas/PlayerAvailabilityUpdate'
        unresolvedTeams:
          type: array
          description: >-
            Squadre reali per cui non e' stato possibile leggere la formazione ufficiale (teamId non
            risolto su SportMonks, fixture non trovato/ambiguo nella finestra di date, o formazione
            non ancora pubblicata)
          items:
            type: string
          example: [Milan]

    PlayerAvailabilityUpdate:
      type: object
      required:
        - playerId
        - name
        - realTeam
        - confirmedStarter
        - startingProbability
      properties:
        playerId:
          type: string
        name:
          type: string
          example: Barella
        realTeam:
          type: string
          example: Inter
        confirmedStarter:
          type: boolean
          description: true se confermato titolare, false se confermato in panchina
        startingProbability:
          type: number
          format: double
          example: 100.0

    MatchStatsSyncResult:
      type: object
      required:
        - updatedPlayers
        - unresolvedTeams
      properties:
        updatedPlayers:
          type: array
          items:
            $ref: '#/components/schemas/PlayerMatchStatUpdate'
        unresolvedTeams:
          type: array
          description: >-
            Squadre reali per cui non e' stato possibile trovare la fixture di questa giornata su
            SportMonks (round non trovato, fixture ambigua/assente o nome squadra non risolto tra i
            participants)
          items:
            type: string
          example: [Milan]

    PlayerMatchStatUpdate:
      type: object
      required:
        - playerId
        - name
        - realTeam
        - gol
        - assist
        - ammonizioni
        - espulsioni
      properties:
        playerId:
          type: string
        name:
          type: string
          example: Barella
        realTeam:
          type: string
          example: Inter
        gol:
          type: integer
        assist:
          type: integer
        ammonizioni:
          type: integer
        espulsioni:
          type: integer
        golSubiti:
          type: integer
          nullable: true
          description: Valorizzato solo per portieri/difensori
        fantavoto:
          type: number
          format: double
          nullable: true
          description: Null se il voto non e' ancora stato inserito manualmente per questa giornata

    FixtureLookupResult:
      type: object
      required:
        - realTeam
        - opponentTeam
        - home
        - matchday
        - status
      properties:
        realTeam:
          type: string
          description: Squadra reale richiesta
          example: Inter
        opponentTeam:
          type: string
          description: Vero avversario di realTeam per la giornata richiesta, da Football-Data.org
          example: Udinese
        home:
          type: boolean
          description: true se realTeam gioca in casa
          example: true
        matchday:
          type: integer
          example: 4
        utcDate:
          type: string
          description: Data/ora UTC della partita (ISO-8601), cosi' come restituita da Football-Data.org
          example: "2026-09-14T18:30:00Z"
        status:
          type: string
          description: Stato della partita su Football-Data.org (es. FINISHED, SCHEDULED, TIMED)
          example: FINISHED

    RosterResponse:
      type: object
      required:
        - teamName
        - goalkeepers
        - defenders
        - midfielders
        - forwards
      properties:
        teamName:
          type: string
          description: Nome della squadra fantacalcistica dell'utente
          example: Junior FC
        goalkeepers:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        defenders:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        midfielders:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        forwards:
          type: array
          items:
            $ref: '#/components/schemas/Player'

    Player:
      type: object
      required:
        - id
        - name
        - realTeam
        - position
        - status
        - nextOpponent
        - startingProbability
        - recentScores
      properties:
        id:
          type: string
          description: id del giocatore
          example: PLAYER#inter_lautaro
        name:
          type: string
          example: Lautaro Martinez
        realTeam:
          type: string
          example: Inter
        position:
          type: string
          enum: [POR, DIF, CEN, ATT]
          example: ATT
        status:
          type: string
          enum: [DISPONIBILE, IN_DUBBIO, INFORTUNATO, SQUALIFICATO]
          example: DISPONIBILE
        nextOpponent:
          type: string
          example: Empoli
        startingProbability:
          type: number
          format: float
          description: Probabilità di titolarità in percentuale (0-100)
          example: 85.0
        recentScores:
          type: array
          description: Ultimi voti/fantamedia ottenuti nelle ultime 3-5 partite
          items:
            type: number
            format: float
          example: [7.5, 6.0, 10.0]

    LineupRequest:
      type: object
      required:
        - matchday
        - modifierActive
      properties:
        matchday:
          type: integer
          description: Numero della giornata di Serie A
          example: 8
        modifierActive:
          type: boolean
          description: Abilita il calcolo del Modificatore di Difesa
          example: true
        teamsWithMidweekMatches:
          $ref: 'lineup-shared-internal.yaml#/components/schemas/TeamsWithMidweekMatchesOverride'

    LineupResponse:
      type: object
      required:
        - winningFormation
        - totalExpectedScore
        - defenseModifierBonus
        - startingEleven
        - bench
      properties:
        winningFormation:
          type: string
          description: Modulo tattico ottimale selezionato (3-4-3, 4-3-3, 3-5-2, 4-4-2)
          example: 4-3-3
        totalExpectedScore:
          type: number
          format: float
          description: Punteggio totale atteso calcolato dall'algoritmo
          example: 74.8
        defenseModifierBonus:
          type: integer
          description: Bonus aggiunto dal Modificatore di Difesa (+0, +1, +3, +6)
          example: 3
        startingEleven:
          type: array
          items:
            $ref: '#/components/schemas/PlayerRatingDetails'
        bench:
          type: array
          items:
            $ref: '#/components/schemas/PlayerRatingDetails'

    PlayerRatingDetails:
      type: object
      required:
        - player
        - fantaRating
        - fantaRatingBreakdown
      properties:
        player:
          $ref: '#/components/schemas/Player'
        fantaRating:
          type: number
          format: float
          description: Rating finale di schierabilità (da 1 a 10)
          example: 8.4
        fantaRatingBreakdown:
          $ref: '#/components/schemas/FantaRatingBreakdown'

    FantaRatingBreakdown:
      type: object
      required:
        - baseFormScore
        - historicalScore
        - matchDifficultyXgScore
        - midweekPenalty
        - availabilityPenalty
      properties:
        baseFormScore:
          type: number
          format: float
          description: Punteggio dal 40% sul recente stato di forma
          example: 3.2
        historicalScore:
          type: number
          format: float
          description: Punteggio dal 30% sullo storico contro l'avversario
          example: 2.1
        matchDifficultyXgScore:
          type: number
          format: float
          description: Punteggio dal 30% sulla difficoltà del match e xG/xA
          example: 2.5
        midweekPenalty:
          type: number
          format: float
          description: Penalità applicata per partite infrasettimanali/coppe
          example: -0.8
        availabilityPenalty:
          type: number
          format: float
          description: Penalità applicata per ballottaggi o dubbio titolarità
          example: 0.0