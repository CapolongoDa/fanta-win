spring.application.name=fanta-win
logging.config=classpath:logback-base.xml

# Carica la configurazione locale (AWS/DynamoDB, football-data, formazioni) da config/application.properties,
# che resta fuori da src/main/resources per non finire impacchettata nel jar (contiene endpoint/credenziali locali).
spring.config.import=optional:file:./config/application.properties
