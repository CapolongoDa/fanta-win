AWSTemplateFormatVersion: '2010-09-09'
Description: FantaWin - storage (DynamoDB) e log group

Parameters:
  ProjectName:
    Type: String
    Description: Nome dell'ambiente/progetto

  # Unused but required by CD pipeline
  MicroserviceNumber:
    Type: Number
    Description: Numero univoco del microservizio nel cluster ECS

  TemplateBucketBaseUrl:
    Type: String
    Description: URL da cui caricare i frammenti di template di infrastruttura


  LogRetention:
    Type: Number
    Default: 14

  LogsKinesisSourceStreamArn:
    Type: String
    Description: Where to send Logs

Resources:
  # Tabella DynamoDB della rosa (single-table: PK USER#..., SK PLAYER#...)
  RosterTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-Roster'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Log group del microservizio
  FantaWinLogGroup:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/log-group.yaml"
      Parameters:
        LogGroupName: !Sub '${ProjectName}-fanta-win'
        LogsKinesisSourceStreamArn: !Ref LogsKinesisSourceStreamArn
        LogGroupRetention: !Ref LogRetention

Outputs:
  RosterTableName:
    Description: Nome della tabella DynamoDB della rosa
    Value: !Ref RosterTable
  RosterTableArn:
    Description: ARN della tabella DynamoDB della rosa
    Value: !GetAtt RosterTable.Arn

  EcsLogGroup:
    Description: Nome del log group ECS
    Value: !GetAtt FantaWinLogGroup.Outputs.LogGroupName