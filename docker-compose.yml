version: "3.9"

services:
  # AWS LocalStack - solo DynamoDB, l'unico servizio AWS usato da FantaWin
  localstack:
    image: 'localstack/localstack:4.1.1'
    ports:
      - '4566-4583:4566-4583'
    environment:
      - EDGE_PORT=4566
      - SERVICES=lambda,s3,sqs,dynamodb,sns,secretsmanager,cloudwatch,ssm,ses,kinesis,events
      - DATA_DIR=${TEMPDATADIR:-/tmp/localstack/data}
      - PROVIDER_OVERRIDE_LAMBDA=v2
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fantawin-network

  # Seeder: attende LocalStack pronto e semina le tabelle in modo riproducibile.
  # Installa i tool richiesti dallo script (bash/aws-cli/jq/bc) cosi' non dipende dall'host.
  seeder:
    depends_on:
      localstack:
        condition: service_healthy
    image: alpine:3.20
    environment:
      - FANTAWIN_DYNAMO_ENDPOINT=http://localstack:4566
      - FANTAWIN_AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./scripts:/scripts:ro"
    entrypoint:
      - /bin/sh
      - -c
      - "apk add --no-cache bash aws-cli jq bc coreutils && bash /scripts/local/init.sh"
    restart: "no"
    networks:
      - fantawin-network

  # Tool di visualizzazione/gestione tabelle DynamoDB
  dynamo-admin:
    depends_on:
      localstack:
        condition: service_healthy
    image: aaronshaf/dynamodb-admin
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - '8001:8001'
    networks:
      - fantawin-network

networks:
  fantawin-network:
    name: fantawin-develop-network

volumes:
  fantawin-localstack-data: