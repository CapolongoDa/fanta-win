logging.config=config/logback-local.xml
server.port=8085
middleware.init.aws=true
spring.cloud.aws.credentials.profile-name=default
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.endpoint=http://localhost:4566

aws.region-code=us-east-1
aws.profile-name=default
aws.endpoint-url=http://localhost:4566
aws.access-key-id=test
aws.secret-access-key=test


fantawin.default-match-difficulty=5.0
fantawin.big-player-threshold=6.5

#Dynamo Db
fantawin.dao.players-table-name=Players
fantawin.dao.player-match-stats-table-name=PlayerMatchStats
fantawin.dao.fixtures-table-name=Fixtures
fantawin.dao.availability-reports-table-name=AvailabilityReports
fantawin.dao.roster-table-name=Roster

#external client
fantawin.football-data-base-url=https://api.football-data.org/v4
# Token dell'account Football-Data.org (header X-Auth-Token). NON committare il valore reale:
# valorizzare tramite variabile d'ambiente FOOTBALL_DATA_API_KEY (es. export FOOTBALL_DATA_API_KEY=xxxx
# prima di avviare l'app, o nella run configuration IDE). Senza token le chiamate rispondono 403.
fantawin.football-data-api-key=${FOOTBALL_DATA_API_KEY:}

# Override manuali opzionali del teamId Football-Data.org per singola squadra reale.
# Il job di sync (FootballDataSyncJob) NON dipende piu' da questa lista: le squadre da
# sincronizzare sono derivate automaticamente dall'anagrafica giocatori (realTeam distinti), e per
# ciascuna il teamId viene risolto per nome via GET /competitions/SA/teams (FootballDataTeamIdResolver).
# Valorizza una riga qui SOLO se per una squadra la risoluzione automatica per nome fallisce (nome
# nell'anagrafica che non corrisponde a nome/shortName/tla su Football-Data.org) - controlla i log
# della sync per capire quali squadre non sono state risolte.
# football-data.team-ids.NomeComeInAnagrafica=<id numerico verificato su Football-Data.org>


fantawin.rest-template.retry-max-attempts=3
fantawin.rest-template.connection-timeout=5000
fantawin.rest-template.read-timeout=10000
pn.log.trace-id-header=x-trace-id
# Moduli supportati per il calcolo predittivo della formazione (difensori,centrocampisti,attaccanti)
fantawin.formations[3-4-3]=3,4,3
fantawin.formations[4-3-3]=4,3,3
fantawin.formations[3-5-2]=3,5,2
fantawin.formations[4-4-2]=4,4,2
